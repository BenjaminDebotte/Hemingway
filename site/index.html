<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiches Techniques Pêche — Littoral Normand</title>
  <meta name="description" content="Guide technique et fiches halieutiques haute-densité pour la pêche sur le Canal de Caen à la mer et la Côte de Nacre en bateau.">
  <link rel="preload" href="fonts/BasisGrotesquePro-Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/01-base.css">
  <link rel="stylesheet" href="css/02-themes.css">
  <link rel="stylesheet" href="css/03-header.css">
  <link rel="stylesheet" href="css/04-views.css">
  <link rel="stylesheet" href="css/05-card-front.css">
  <link rel="stylesheet" href="css/06-card-back.css">
  <link rel="stylesheet" href="css/07-print.css">
</head>
<body>

  <!-- EN-TÊTE PRINCIPAL & CONTRÔLES -->
  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg class="ui-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">
            <path d="M19 12c-4 4-10 4-15 0 5-4 11-4 15 0z"/>
            <path d="M4 12L2 9.5v5L4 12z"/>
            <circle cx="15" cy="11" r="1" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <div class="brand-eyebrow">Normandie Maritime • DPM & Mer</div>
          <h1 class="brand-title">Fiches Techniques Pêche</h1>
          <p class="brand-subtitle">Canal de Caen à la mer & Côte de Nacre en bateau</p>
        </div>
      </div>

      <div class="header-actions">
        <div class="mode-segmented" role="tablist" aria-label="Modes d'affichage">
          <button class="mode-btn active" data-mode="duo" role="tab" aria-selected="true">
            <svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15z"/>
            </svg>
            <span>Vue Dépliée</span>
          </button>
          <button class="mode-btn" data-mode="flip" role="tab" aria-selected="false">
            <svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/>
              <polyline points="21 3 21 8 16 8"/>
            </svg>
            <span>Fiches Réversibles</span>
          </button>
          <button class="mode-btn" data-mode="print" role="tab" aria-selected="false">
            <svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <rect x="3" y="3" width="18" height="18" rx="2"/>
              <line x1="12" y1="3" x2="12" y2="21"/>
            </svg>
            <span>Planches A4</span>
          </button>
        </div>

        <!-- SÉLECTEUR DE THÈME DYNAMIQUE (3 UNIVERS × JOUR/NUIT) -->
        <div class="theme-picker-wrap">
          <button id="btn-theme-trigger" class="theme-trigger-btn" aria-haspopup="dialog" aria-expanded="false" aria-label="Choisir l'univers de couleur et le mode Jour/Nuit">
            <span class="theme-trigger-dot" id="theme-trigger-dot"></span>
            <span class="theme-trigger-label" id="theme-trigger-label">De School</span>
            <span class="theme-trigger-mode-icon" id="theme-trigger-mode-icon" aria-hidden="true">
              <svg class="ui-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            </span>
          </button>

          <div id="theme-popover" class="theme-popover" role="dialog" aria-label="Personnalisation de l'affichage" hidden>
            <div class="theme-popover-header">
              <span class="theme-popover-title">Palette & Affichage</span>
            </div>

            <div class="theme-section">
              <span class="theme-section-label">Univers Halieutique</span>
              <div class="theme-universes-grid" role="radiogroup" aria-label="Palette de couleurs">
                <button type="button" class="theme-opt-btn active" data-theme-val="deschool" role="radio" aria-checked="true">
                  <span class="theme-opt-swatches">
                    <span class="theme-swatch" style="background: #000000;"></span>
                    <span class="theme-swatch" style="background: #ffffff; border: 1px solid #737373;"></span>
                    <span class="theme-swatch" style="background: #f9f6ef; border: 1px solid #737373;"></span>
                  </span>
                  <span class="theme-opt-info">
                    <span class="theme-opt-name">De School / Archief</span>
                    <span class="theme-opt-desc">Brutalisme Amsterdam • Papier & Zwart</span>
                  </span>
                </button>

                <button type="button" class="theme-opt-btn" data-theme-val="estran" role="radio" aria-checked="false">
                  <span class="theme-opt-swatches">
                    <span class="theme-swatch" style="background: #059669;"></span>
                    <span class="theme-swatch" style="background: #0d9488;"></span>
                    <span class="theme-swatch" style="background: #d97706;"></span>
                  </span>
                  <span class="theme-opt-info">
                    <span class="theme-opt-name">Estran & Varech</span>
                    <span class="theme-opt-desc">Laminaires • Roches du Calvados & Écume</span>
                  </span>
                </button>

                <button type="button" class="theme-opt-btn" data-theme-val="epaves" role="radio" aria-checked="false">
                  <span class="theme-opt-swatches">
                    <span class="theme-swatch" style="background: #c2410c;"></span>
                    <span class="theme-swatch" style="background: #ca8a04;"></span>
                    <span class="theme-swatch" style="background: #64748b;"></span>
                  </span>
                  <span class="theme-opt-info">
                    <span class="theme-opt-name">Épaves & Rouille</span>
                    <span class="theme-opt-desc">Acier 1944 • Terracotta & Laiton Maritime</span>
                  </span>
                </button>

                <button type="button" class="theme-opt-btn" data-theme-val="dune" role="radio" aria-checked="false">
                  <span class="theme-opt-swatches">
                    <span class="theme-swatch" style="background: #b45309;"></span>
                    <span class="theme-swatch" style="background: #d97706;"></span>
                    <span class="theme-swatch" style="background: #a8a29e;"></span>
                  </span>
                  <span class="theme-opt-info">
                    <span class="theme-opt-name">Dune & Calcaire</span>
                    <span class="theme-opt-desc">Pierre de Caen • Sable Doré & Lin Normand</span>
                  </span>
                </button>

                <button type="button" class="theme-opt-btn" data-theme-val="carbon" role="radio" aria-checked="false">
                  <span class="theme-opt-swatches">
                    <span class="theme-swatch" style="background: #84cc16;"></span>
                    <span class="theme-swatch" style="background: #27272a;"></span>
                    <span class="theme-swatch" style="background: #10b981;"></span>
                  </span>
                  <span class="theme-opt-info">
                    <span class="theme-opt-name">Carbone Sondeur</span>
                    <span class="theme-opt-desc">Graphite Furtif • Signal Sondeur Lime CHIRP</span>
                  </span>
                </button>

                <button type="button" class="theme-opt-btn" data-theme-val="shom" role="radio" aria-checked="false">
                  <span class="theme-opt-swatches">
                    <span class="theme-swatch" style="background: #1d4ed8;"></span>
                    <span class="theme-swatch" style="background: #0f766e;"></span>
                    <span class="theme-swatch" style="background: #b45309;"></span>
                  </span>
                  <span class="theme-opt-info">
                    <span class="theme-opt-name">Carte SHOM</span>
                    <span class="theme-opt-desc">Hydrographie • Bleu Nuit d'Encre & Estran</span>
                  </span>
                </button>
              </div>
            </div>

            <div class="theme-section">
              <span class="theme-section-label">Luminosité Terrain</span>
              <div class="theme-mode-switch" role="radiogroup" aria-label="Mode lumineux">
                <button type="button" class="mode-switch-btn active" data-mode-val="light" role="radio" aria-checked="true">
                  <svg class="ui-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                  <span>Jour</span>
                </button>
                <button type="button" class="mode-switch-btn" data-mode-val="dark" role="radio" aria-checked="false">
                  <svg class="ui-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                  <span>Nuit</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <button id="btn-print" class="btn btn-gold btn-island" aria-label="Imprimer les fiches techniques au format A4">
          <span class="btn-text">Imprimer les fiches</span>
          <span class="btn-icon-bubble" aria-hidden="true">
            <svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <polyline points="6 9 6 2 18 2 18 9"/>
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
              <rect x="6" y="14" width="12" height="8"/>
            </svg>
          </span>
        </button>
      </div>
    </div>

    <div class="controls-bar">
      <div class="search-and-toggles">
        <div class="search-input-wrap">
          <span class="search-icon" aria-hidden="true">
            <svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" focusable="false">
              <circle cx="11" cy="11" r="7"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </span>
          <input type="text" id="search-input" class="search-input" placeholder="Rechercher un poisson, un leurre, un spot, une technique..." aria-label="Recherche">
        </div>

        <div class="biotope-filter-wrap">
          <label for="biotope-select" class="biotope-label">Milieu :</label>
          <div class="biotope-select-shell">
            <select id="biotope-select" class="biotope-select">
              <option value="all">Tous les biotopes</option>
              <option value="canal">Canal de Caen uniquement</option>
              <option value="bateau">Côte de Nacre en bateau</option>
            </select>
          </div>
        </div>
      </div>

      <div class="filter-pills" id="category-pills">
        <!-- Généré dynamiquement par JS -->
      </div>
    </div>
  </header>

  <!-- CONTENU PRINCIPAL : VUE INTERACTIVE -->
  <main class="main-container">
    <div class="view-stats">
      <span id="view-stats" class="view-stats-count">Chargement des données...</span>
      <span id="view-hint" class="view-hint">Mode Déplié : Face A (Identité) et Face B (Tactique) affichées côte-à-côte</span>
    </div>

    <div class="cards-grid" id="cards-grid">
      <!-- Généré dynamiquement par JS -->
    </div>
  </main>

  <!-- CONTENEUR POUR L'IMPRESSION EN PLANCHES A4 RECTO/VERSO -->
  <div class="print-view-container" id="print-sheets-container">
    <!-- Généré dynamiquement par JS sous forme de planches A4 paysage (2 cartes par planche) -->
  </div>

  <!-- SCRIPT DES DONNÉES PUIS MOTEUR LOGIQUE MODULAIRE -->
  <script src="data.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
